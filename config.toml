# Settings for wrangle.py.
# Folder paths are relative to this file. Column names are matched after trimming spaces.
# wrangle.py checks these settings first, then each file's sheet and columns as it reads it,
# and stops with a message naming what to fix.

[paths]
input_folder = ".."
output_folder = "output"
mappings_folder = "mappings"
# Run logs, one file per run; the newest 20 are kept. Not used when
# HWW_LOG_FORMAT=json (in GCP), which logs to the console only.
log_folder = "logs"

[output]
# Where the tables, the report and the run record go:
#   "folder"   - CSV files in output_folder (above): laptops and tests
#   "bigquery" - tables in a BigQuery dataset, replaced all at once
# Any value can use ${NAME} for an environment variable, so a GCP config
# can take its names from the job, e.g.:
#   target = "bigquery"
#   project = "${HWW_BQ_PROJECT}"
#   dataset = "${HWW_BQ_DATASET}"
#   location = "europe-west2"
target = "folder"

[landed]
# Ingestion with py-common (python ingest.py): each workbook is
# checked against its contract (src/hww_dashboard/landing.py) and each
# sheet loaded into a raw JSON table: hww_signups, hww_survey, hww_was,
# hww_peer. Personal and unused columns are never loaded.
#
# read = true makes wrangle.py read the newest load of those tables
# instead of the workbooks in input_folder. Run python ingest.py first.
read = false
# Where the files are dropped and the tables kept:
#   "local" - folders below, relative to this file (laptops, tests).
#             Drop each workbook in <landing_folder>/<folder>/, where
#             folder is signups (the monitoring workbook, which loads
#             both hww_signups and hww_survey), was or peer.
#   "gcp"   - a landing bucket and a BigQuery dataset, e.g.:
#               target = "gcp"
#               project = "${HWW_GCP_PROJECT}"
#               landing_bucket = "${HWW_LANDING_BUCKET}"
#               landing_prefix = "hww"   # files in hww/<folder>/
#               store_bucket = "${HWW_STORE_BUCKET}"
#               dataset = "${HWW_LANDED_DATASET}"
target = "local"
landing_folder = "landing"
store_folder = "store"
tables_folder = "landed"

[signups]
file = "dummy_HWW monitoring and reporting.xlsx"
sheet = "Account signups"
header_row = 2            # Excel row that holds the column headings
# The month column has no heading, so it is referred to by its Excel letter.
month = "B"
org = "Org (duplicates in red)"
role = "Role (complete if duplicate org)"
size = "Size"
sector = "Sector"
industry = "Industry"
sites = "Number of sites"
completed_survey = "Completed survey?"
requested_was = "Requested WAS?"

[survey]
# The Survey info tab of the monitoring workbook: one row per response,
# newest first. The same workbook as [signups].
file = "dummy_HWW monitoring and reporting.xlsx"
sheet = "Survey info"
header_row = 2            # Excel row that holds the column headings
# Which column is which question lives in mappings/survey_columns.csv.
# Free text typed into "Other (more info)" boxes may contain personal details, so it is off by default.
keep_other_free_text = false

[was]
file = "dummy_was_database.xlsx"
sheet = 0
header_row = 1
id = "Participant ID"
org = "Title"
enquiry_date = "Date of Enquiry"
fallback_enquiry_date = "Date allocated to adviser"
size = "Number of employees"
sector = "Sector"
industry = "Organisation Industry"
sites = "Number of sites"
topic_separator = ";#"
# When is a WAS request "completed"? One of:
#   "summary_1_sent"     - the session 1 summary has been sent (date = summary date)
#   "session_1_held"     - session 1 has a date
#   "last_session_held"  - date of the latest session that has a date
completed_rule = "summary_1_sent"

[[was.sessions]]
number = 1
date = "Date of Session 1"
duration = "Duration of session 1"
summary_sent = "Date summary sent to organisation"
topics = "Topics discussed in session 1"

[[was.sessions]]
number = 2
date = "Date of session 2"
duration = "Duration of session 2"
summary_sent = "Date Summary 2 sent"
topics = "Topics discussed in session 2"

[[was.sessions]]
number = 3
date = "Date of Session 3"

[peer]
file = "dummy_peer_montoring.xlsx"
sheet = 0
header_row = 1
id = "Participant ID"
org = "Business Name"
interest_date = "Date of expression of interest"
size = "Business Size"
sector = "Sector"
industry = "Industry"

[checks]
# A source with no data rows stops the run: an empty upload usually means a
# broken export. Where no rows is a real answer, add allow_empty = true to
# that source's section.
# A source with a larger share of rows gone than this, compared with the
# last published run, is a warning to check the upload (0.1 = 10%).
max_row_drop = 0.1

[employers]
# When duplicate rows for one organisation disagree, the most common value wins.
# On a tie, a specific value beats "Other", then this source order decides.
source_priority = ["signups", "survey", "was", "peer"]

[privacy]
# These columns must never reach the output. The script only keeps the columns it needs,
# and the tests fail if any of these names appears in an output file.
personal_columns = [
    "Full Name", "Email address", "Email Address", "First Name", "Last Name",
    "Job role", "Job Role Title", "Key contact", "Preferred contact details",
    "Accessibility requirements including language", "HWW Adviser", "HWW Adviser (Cohort)",
    "User IP", "User Agent", "Created By (User Id)", "Source Url", "Post Id",
    "Transaction Id", "Payment Amount", "Payment Date", "Payment Status",
    "Submission Speed (ms)", "PDF: HWW Employer Survey Tool",
    "PDF: HWW Employer Survey Tool (Internal)", "Item Type", "Path",
]
