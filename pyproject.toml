# The HWW dashboard prototype: an installable package (src/hww_dashboard)
# plus the project files it runs on (config.toml, mappings/, output/).
# Install it with
#
#   pip install -e ".[dev]" -c constraints.txt
#
# and run the checks with:
#
#   black --check .     layout (PEP 8, 79-character lines)
#   ruff check .        lint (PEP 8, imports, naming, Google docstrings)
#   mypy                type check (strict)
#   pytest              tests, golden outputs and page smoke tests

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hww-dashboard"
version = "0.2.0"
description = "Healthy Working Wales reference pipeline and interim BigQuery publisher"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
# Upper bounds stop a fresh install pulling in a major version the code
# has not been tested against. The lower bounds are the oldest versions
# CI tests. constraints.txt pins one tested version of everything.
dependencies = [
    "pandas>=2.2.3,<4",
    "openpyxl>=3.1.5,<4",
]

# Commands installed with the package, usable from any folder:
#   hww-ingest     land the workbooks with py-common (needs [landing])
#   hww-wrangle    build the tables and the report
#   hww-run        hww-ingest, then hww-wrangle if it succeeded (the
#                  scheduled job)
#   hww-dashboard  start the Streamlit dashboard (needs [dashboard])
# Each takes the config file as its argument, config.toml by default.
[project.scripts]
hww-ingest = "hww_dashboard.landing:main"
hww-wrangle = "hww_dashboard.wrangle:main"
hww-run = "hww_dashboard.job:main"
hww-dashboard = "hww_dashboard.serve:main"

[project.optional-dependencies]
# The Streamlit dashboard (requirements.txt installs it).
dashboard = [
    # 1.63 is the first release whose st.pills() takes wrap=.
    "streamlit>=1.63,<2",
    "plotly>=5.24,<8",
]
# Loading the tables into BigQuery. The same range as py-common's gcp
# extra.
bigquery = [
    "google-cloud-bigquery>=3.13,<4",
]
# Ingestion with py-common (python ingest.py; [landed] in config.toml).
# Pinned to a commit of the shared library; its gcp extra brings the GCS
# and BigQuery adapters. Replace <GITHUB_ORG> with the GitHub
# organisation that hosts py-common before installing this extra (or
# dev, which includes it).
landing = [
    "py-common[gcp] @ git+https://github.com/<GITHUB_ORG>/py-common.git@27163d25677852811bebc102ffc0a3ea3658bb2b",
]
# The upload-triggered Cloud Run service (hww_dashboard.service).
service = [
    "functions-framework>=3.8,<4",
]
dev = [
    "hww-dashboard[dashboard,bigquery,landing]",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # Exact pins, the same as py-common's and the hook revs in
    # .pre-commit-config.yaml, so both projects are formatted and linted
    # alike. Bump them together.
    "black==26.10.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pandas-stubs",
    "types-openpyxl",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The output contract: one BigQuery-style schema per table.
hww_dashboard = ["py.typed", "schema/*.json", "schema/bigquery/*.json"]

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle (PEP 8)
    "F",        # pyflakes: unused names, undefined names
    "I",        # import order
    "N",        # PEP 8 naming
    "D",        # docstrings
    "UP",       # modern syntax for the target Python version
    "B",        # likely bugs (mutable defaults, closures in loops, ...)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["hww_dashboard"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts", "wrangle.py", "dashboard.py", "ingest.py"]
mypy_path = "src"
strict = true
# google-api-core's exception classes have no type hints; the tests
# construct them to stand in for BigQuery's errors.
untyped_calls_exclude = ["google.api_core.exceptions"]

[[tool.mypy.overrides]]
# py-common is fully typed (it runs mypy --strict) but ships no py.typed
# marker, so mypy is told to follow it rather than treat it as untyped.
module = ["py_common", "py_common.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
# plotly ships without type information.
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import test modules without putting their folder on sys.path: the code
# under test is imported from the installed package, as users import it.
addopts = ["--import-mode=importlib"]
markers = [
    "integration: needs a real BigQuery test dataset (skipped without one)",
]

[tool.coverage.run]
source = ["hww_dashboard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Just under today's figure (93% with branches), so coverage can't fall
# far without CI saying so.
fail_under = 90
