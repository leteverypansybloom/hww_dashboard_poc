name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and its developer tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Static checks run first: they take seconds and fail fast. All
      # three read their settings from pyproject.toml.
      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Black
        run: black --check .

      - name: Type check with mypy
        run: mypy

      # Unit tests, the golden-output comparison and the Streamlit page
      # smoke tests. Everything they read is in the repository.
      - name: Run tests
        run: pytest -v
